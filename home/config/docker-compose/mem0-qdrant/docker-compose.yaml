# Qdrant vector database for Mem0 semantic memory

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0@sha256:dd037bc4175c162e23b87c8f584bff72fba65a49e2ff4540ae7e9ac76ed3fd73
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333" # REST API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
