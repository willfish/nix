onboarding = false

[update]
channel = "stable"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "rose-pine"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[ui]
mouse_capture = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+b"

detach = "prefix+q"
open_notification_target = "prefix+alt+o"
workspace_picker = "prefix+w"
goto = "prefix+g"

new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = ""
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
rename_tab = "prefix+comma"
close_tab = "prefix+shift+x"

edit_scrollback = "prefix+e"
copy_mode = "prefix+["

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+o"
type = "pane"
command = "herdr-zoxide-workspace"

[[keys.command]]
key = "alt+h"
type = "shell"
command = "herdr-navigate left alt+h"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "herdr-navigate down alt+j"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "herdr-navigate up alt+k"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "herdr-navigate right alt+l"

[[keys.command]]
key = "prefix+space"
type = "pane"
command = "herdr-thumbs"

# Herdr does not expose tmux-jump's copy-mode cursor movement. Use the
# token picker on the original tmux-jump key as the closest available flow.
[[keys.command]]
key = "prefix+j"
type = "pane"
command = "herdr-thumbs"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "herdr-yank line"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "herdr-yank cwd"

navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
