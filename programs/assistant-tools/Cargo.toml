[package]
name = "local-assistant-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
cap-std = "4"
chardetng = "0.1"
encoding_rs = "0.8"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "gzip", "brotli", "deflate"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "io-util"] }
unicode-casefold = "0.2"
url = "2"
walkdir = "2"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
