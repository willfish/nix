[package]
name = "book-library"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
fs2 = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal"] }
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
