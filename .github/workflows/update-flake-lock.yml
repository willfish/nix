name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.UPDATE_FLAKE_LOCK_TOKEN || github.token }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@9adf02b41cfdac2632e1c16f0480ff5bf3b05dd6 # v3

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ secrets.UPDATE_FLAKE_LOCK_TOKEN || github.token }}
          commit-msg: |
            chore(deps): update nix flake inputs

            Issue: No ticket/issue
          pr-title: "chore(deps): update nix flake inputs"
          pr-body: |
            Automated flake input update.

            Issue: No ticket/issue

            ```text
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
