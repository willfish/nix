name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.UPDATE_FLAKE_LOCK_TOKEN || github.token }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ secrets.UPDATE_FLAKE_LOCK_TOKEN || github.token }}
          commit-msg: |
            chore(deps): update nix flake inputs

            Issue: No ticket/issue
          pr-title: "chore(deps): update nix flake inputs"
          pr-body: |
            Automated flake input update.

            Issue: No ticket/issue

            ```text
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
