name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.UPDATE_FLAKE_LOCK_TOKEN || github.token }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@629b284231c2a82554b724e357e47fc6020833c8 # v3

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ secrets.UPDATE_FLAKE_LOCK_TOKEN || github.token }}
          commit-msg: |
            chore(deps): update nix flake inputs

            Issue: No ticket/issue
          pr-title: "chore(deps): update nix flake inputs"
          pr-body: |
            Automated flake input update.

            Issue: No ticket/issue

            ```text
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
