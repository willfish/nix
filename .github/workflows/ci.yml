name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-linux:
    name: Nix Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            eval-cores = 1
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Run flake checks
        run: nix flake check -L

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Audit LLM skill harness
        run: python3 home/config/llm/scripts/audit-skills

      - name: Evaluate every Home Manager configuration
        run: >-
          nix eval --json .#homeConfigurations
          --apply 'homes: builtins.mapAttrs (_: home: home.activationPackage.drvPath) homes'

  home-manager-linux:
    name: Home Manager Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          # Nix provides build toolchains; these preinstalled SDKs are unused.
          # Paths: https://github.com/actions/runner-images/tree/main/images/ubuntu
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            eval-cores = 1
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build Linux Home Manager activation packages
        run: |
          nix build --no-link \
            .#homeConfigurations.william-linux.activationPackage \
            '.#homeConfigurations."william@andromeda".activationPackage' \
            '.#homeConfigurations."william@foundation".activationPackage' \
            '.#homeConfigurations."william@starfish".activationPackage' \
            '.#homeConfigurations."william@terminus".activationPackage'

      - name: Run complete offline behavioral and runtime gate
        run: |
          set -euo pipefail
          generation="$(nix eval --raw .#homeConfigurations.william-linux.activationPackage.outPath)"
          nix develop --command python3 scripts/check-behavior.py "$generation"

  nixos-hosts:
    name: NixOS ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - andromeda
          - starfish
          - foundation
          - terminus
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          # NixOS closures and kernel builds need the SDK space on hosted Ubuntu.
          # Paths: https://github.com/actions/runner-images/tree/main/images/ubuntu
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            eval-cores = 1
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build host
        run: nix build -L ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --no-link

  nix-darwin:
    name: Nix Darwin
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build Darwin Home Manager activation package
        run: nix build .#homeConfigurations.william-darwin.activationPackage --no-link
