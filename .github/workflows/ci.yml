name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-linux:
    name: Nix Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # v3.21.0
        with:
          determinate: false
          extra-conf: |
            eval-cores = 1

      - name: Run flake checks
        run: nix flake check -L

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Check Linux Home Manager activation package closure
        run: nix build .#homeConfigurations.william-linux.activationPackage --dry-run

  nix-darwin:
    name: Nix Darwin
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # v3.21.0
        with:
          determinate: false

      - name: Check Darwin Home Manager activation package closure
        run: nix build .#homeConfigurations.william-darwin.activationPackage --dry-run
