name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-linux:
    name: Nix Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # v3.21.0
        with:
          determinate: false
          extra-conf: |
            eval-cores = 1

      - name: Run flake checks
        run: nix flake check -L

      - name: Check Linux Home Manager activation package closure
        run: nix build .#homeConfigurations.william-linux.activationPackage --dry-run

  nix-darwin:
    name: Nix Darwin
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # v3.21.0
        with:
          determinate: false

      - name: Check Darwin Home Manager activation package closure
        run: nix build .#homeConfigurations.william-darwin.activationPackage --dry-run
