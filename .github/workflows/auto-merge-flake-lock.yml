name: Auto-merge flake.lock updates

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  AUTO_MERGE_GITHUB_OWNERS: |
    willfish

jobs:
  enable-auto-merge:
    name: Approve CI and enable auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'update_flake_lock_action' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft == false
    steps:
      - name: Verify PR only updates flake.lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          comparison="$(gh api --method GET "repos/$GH_REPO/compare/$BASE_SHA...$HEAD_SHA")"
          # The compare API caps commits at 250 and files at 300. Require all
          # commits and exactly one file, so truncated results cannot pass.
          if ! jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '
            .base_commit.sha == $base and
            .merge_base_commit.sha == $base and
            .status == "ahead" and
            (.commits | type) == "array" and
            .total_commits > 0 and .total_commits <= 250 and
            .total_commits == (.commits | length) and
            .commits[-1].sha == $head and
            (.files | type) == "array" and (.files | length) == 1 and
            .files[0].filename == "flake.lock" and
            .files[0].status == "modified" and
            (.files[0] | has("previous_filename") | not)
          ' <<< "$comparison" >/dev/null; then
            echo "Immutable comparison is not a complete lock-only update; manual review required." >&2
            exit 1
          fi

      # Only base-branch code runs with the pull_request_target token.
      - name: Check out trusted lock policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify changed flake inputs are auto-mergeable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          gh api --method GET "repos/$GH_REPO/contents/flake.lock" \
            -f ref="$BASE_SHA" \
            --jq '.content' | base64 --decode > "$tmpdir/base.lock"
          gh api --method GET "repos/$GH_REPO/contents/flake.lock" \
            -f ref="$HEAD_SHA" \
            --jq '.content' | base64 --decode > "$tmpdir/head.lock"

          python3 -I scripts/check-flake-lock-update.py "$tmpdir/base.lock" "$tmpdir/head.lock"

      - name: Approve CI workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 12); do
            run_ids="$(gh api --method GET "repos/$GH_REPO/actions/runs" \
              -f event=pull_request \
              -f branch="$HEAD_REF" \
              --jq '.workflow_runs[]
                | select(.name == "CI")
                | select(.head_sha == env.HEAD_SHA)
                | select(.conclusion == "action_required")
                | .id')"

            if [ -n "$run_ids" ]; then
              printf '%s\n' "$run_ids" | while IFS= read -r run_id; do
                gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/approve"
              done
              exit 0
            fi

            sleep 5
          done

          echo "No pending CI workflow run found for $HEAD_SHA."

      - name: Enable pull request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          current_commits="$(gh pr view "$PR_URL" --json baseRefOid,headRefOid \
            --jq '.baseRefOid + " " + .headRefOid')"
          if [ "$current_commits" != "$BASE_SHA $HEAD_SHA" ]; then
            echo "PR base or head changed since lock verification; manual review required." >&2
            exit 1
          fi

          gh pr merge "$PR_URL" \
            --auto \
            --match-head-commit "$HEAD_SHA" \
            --rebase \
            --delete-branch
